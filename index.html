<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BRDC King &amp; Queen</title>
<meta name="description" content="Vote for King and Queen of the Night at the BRDC Year-End Party.">
<meta name="theme-color" content="#090c08">
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <header class="mast">
    <img class="logo" src="assets/logo.jpg" alt="Bahama Realty and Development Corporation">
    <span class="pill" id="pill" data-s="setup"><i></i><span id="pill-t">Loading</span></span>
  </header>

  <section class="hero">
    <div class="eyebrow" id="ev-eyebrow">BRDC Year-End Party 2026</div>
    <h1>Who wears the <em>crown</em> tonight?</h1>
    <p>Vote for one King and one Queen of the night. One ballot per phone, and nobody can see how you voted.</p>
  </section>

  <div id="notice"></div>
  <section id="results" class="results" hidden></section>
  <section id="ballot" class="ballot" aria-label="Ballot" hidden></section>
</div>

<div class="castbar" id="castbar" hidden>
  <div class="castbar-in">
    <div class="picks" id="picks"></div>
    <button class="btn btn-gold" id="cast-btn" type="button">Cast ballot</button>
  </div>
</div>

<div class="modal" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="cf-t">
  <div class="modal-card">
    <h3 id="cf-t">Cast your ballot?</h3>
    <div class="modal-picks" id="cf-picks"></div>
    <p class="muted" style="margin:0">You can only vote once from this phone, so double-check your picks.</p>
    <div class="actions" style="justify-content:flex-end">
      <button class="btn" id="cf-back" type="button">Go back</button>
      <button class="btn btn-gold" id="cf-go" type="button">Cast ballot</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/vote.js"></script>
</body>
</html>
